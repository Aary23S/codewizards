              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Send as `Authorization: Bearer <token>`. Tokens are issued by
        /api/v1/auth/register and /api/v1/auth/login, and are invalidated
        (all of them, across devices) by /api/v1/auth/logout or a password reset.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: MongoDB ObjectId
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
      description: 1-based page number. Pagination only activates when both page and limit are sent.
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
      description: Page size (server caps at 100). Pagination only activates when both page and limit are sent.
    FeaturedFilter:
      name: featured
      in: query
      schema: { type: string, enum: ["true"] }
      description: Pass "true" to return only featured projects

  schemas:
    # ---------- shared envelopes ----------
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Something went wrong. Please try again." }

    SuccessMessage:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Deleted" }

    PaginationMeta:
      type: object
      description: Present in the response only when both `page` and `limit` query params were sent.
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 57 }

    CooldownResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Please wait 173s before syncing again." }
        meta:
          type: object
          properties:
            cooldownRemainingMs: { type: integer }
            cooldownMs: { type: integer }

    # ---------- Auth ----------
    AuthUser:
      type: object
      description: Subset of User returned by register/login, plus a signed JWT.
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [student, senior, alumni, admin] }
        batch: { type: integer }
        programName: { type: string }
        programDurationYears: { type: integer }
        token: { type: string, description: "Signed JWT" }

    # ---------- User ----------
    ContactPreferences:
      type: object
      properties:
        email: { type: boolean, default: true }
        phone: { type: boolean, default: false }
        whatsapp: { type: boolean, default: false }
        discord: { type: boolean, default: false }

    ExperienceEntry:
      type: object
      properties:
        title: { type: string }
        company: { type: string }
        location: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        description: { type: string }

    EducationEntry:
      type: object
      properties:
        school: { type: string }
        degree: { type: string }
        fieldOfStudy: { type: string }
        startDate: { type: string }
        endDate: { type: string }

    CertificationEntry:
      type: object
      properties:
        name: { type: string }
        issuer: { type: string }
        issueDate: { type: string }
        credentialUrl: { type: string }

    ExternalStats:
      type: object
      properties:
        codeforcesRating: { type: integer, nullable: true }
        leetcodeSolveScore: { type: integer, nullable: true }
        githubContributions: { type: integer, nullable: true }
        lastSynced: { type: string, format: date-time, nullable: true }

    User:
      type: object
      description: >
        password, resetPasswordToken, resetPasswordExpire, and tokenVersion are
        `select:false` on the model and are never returned by the API.
        The public-listing endpoints (GET /users, GET /users/{id}) additionally
        omit email, phone, whatsapp, discord, and contactPreferences.
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [student, senior, alumni, admin] }
        batch: { type: integer }
        programName: { type: string }
        programDurationYears: { type: integer }
        domain: { type: array, items: { type: string } }
        bio: { type: string }
        imageUrl: { type: string }
        isMentor: { type: boolean }
        currentCompany: { type: string }
        designation: { type: string }
        professionalExperience: { type: string }
        location: { type: string }
        headline: { type: string }
        isVerified: { type: boolean }
        employmentType: { type: string }
        workMode: { type: string }
        startDateText: { type: string }
        canHelpWith: { type: array, items: { type: string } }
        mentorshipAvailability: { type: string, enum: [open, limited, unavailable] }
        maxActiveStudents: { type: integer }
        typicalResponseTime: { type: string }
        preferredContactMethod: { type: string }
        experiences: { type: array, items: { $ref: "#/components/schemas/ExperienceEntry" } }
        education: { type: array, items: { $ref: "#/components/schemas/EducationEntry" } }
        certifications: { type: array, items: { $ref: "#/components/schemas/CertificationEntry" } }
        linkedin: { type: string }
        github: { type: string }
        leetcode: { type: string }
        codeforces: { type: string }
        portfolio: { type: string }
        codeforcesHandle: { type: string }
        leetcodeUsername: { type: string }
        githubUsername: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        discord: { type: string }
        contactPreferences: { $ref: "#/components/schemas/ContactPreferences" }
        isSuspended: { type: boolean }
        suspendedReason: { type: string }
        externalStats: { $ref: "#/components/schemas/ExternalStats" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/User" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    UserCreateForm:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        role: { type: string, enum: [student, senior, alumni, admin], default: student }
        batch: { type: integer }
        programName: { type: string, default: "" }
        programDurationYears: { type: integer, default: 4 }
        domain: { type: string, description: "Comma-separated list, e.g. \"Web,AI\"" }
        bio: { type: string }
        imageUrl: { type: string, description: "Ignored if an image file is uploaded" }
        isMentor: { type: string, enum: ["true", "false"] }
        github: { type: string }
        linkedin: { type: string }
        leetcode: { type: string }
        codeforces: { type: string }
        portfolio: { type: string }
        image: { type: string, format: binary }

    UserUpdateForm:
      type: object
      description: >
        Any User field may be sent; role/externalStats/isVerified/isSuspended/suspendedReason
        are stripped server-side unless the caller is an admin. experiences/education/certifications
        accept a JSON-encoded string when sent as multipart form fields.
      properties:
        name: { type: string }
        bio: { type: string }
        domain: { type: string, description: "Comma-separated list" }
        canHelpWith: { type: string, description: "Comma-separated list" }
        isMentor: { type: string, enum: ["true", "false"] }
        contactPreferences: { type: string, description: "JSON-encoded ContactPreferences object" }
        experiences: { type: string, description: "JSON-encoded array of ExperienceEntry" }
        education: { type: string, description: "JSON-encoded array of EducationEntry" }
        certifications: { type: string, description: "JSON-encoded array of CertificationEntry" }
        linkedin: { type: string }
        github: { type: string }
        leetcode: { type: string }
        codeforces: { type: string }
        portfolio: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        discord: { type: string }
        image: { type: string, format: binary }

    # ---------- Project ----------
    Project:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        techStack: { type: array, items: { type: string } }
        contributors: { type: array, items: { type: string } }
        postedBy: { type: string, nullable: true }
        githubUrl: { type: string }
        demoUrl: { type: string }
        imageUrl: { type: string }
        featured: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        description: { type: string }
        techStack: { type: array, items: { type: string } }
        contributors: { type: array, items: { type: string } }
        postedBy: { type: string, description: "User id credited for project_posted points" }
        githubUrl: { type: string }
        demoUrl: { type: string }
        imageUrl: { type: string }
        featured: { type: boolean }

    ProjectListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Project" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Event ----------
    Event:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        type: { type: string, enum: [workshop, hackathon, contest, seminar, other] }
        description: { type: string }
        date: { type: string, format: date-time }
        venue: { type: string }
        imageUrl: { type: string }
        registrationLink: { type: string }
        status: { type: string, enum: [upcoming, completed] }
        featured: { type: boolean }
        otpCode: { type: string, nullable: true }
        otpExpiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventWithRegistration:
      allOf:
        - { $ref: "#/components/schemas/Event" }
        - type: object
          properties:
            registration:
              type: object
              description: Computed per-request based on the caller's identity (or ?studentId).
              properties:
                isRegistered: { type: boolean }
                status: { type: string, enum: [registered, cancelled, attended], nullable: true }
                certificateHash: { type: string, nullable: true }
                attendedAt: { type: string, format: date-time, nullable: true }
                registeredCount: { type: integer }

    EventInputForm:
      type: object
      required: [title, date]
      properties:
        title: { type: string }
        type: { type: string, enum: [workshop, hackathon, contest, seminar, other] }
        description: { type: string }
        date: { type: string, format: date-time, description: "status is auto-derived from this date" }
        venue: { type: string }
        registrationLink: { type: string }
        featured: { type: string, enum: ["true", "false"] }
        image: { type: string, format: binary }

    EventRegistration:
      type: object
      properties:
        _id: { type: string }
        eventId: { type: string }
        studentId: { type: string }
        status: { type: string, enum: [registered, cancelled, attended] }
        certificateHash: { type: string, nullable: true }
        attendedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---------- Timeline ----------
    Timeline:
      type: object
      properties:
        _id: { type: string }
        year: { type: integer }
        month: { type: string }
        title: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TimelineInput:
      type: object
      required: [year, title]
      properties:
        year: { type: integer }
        month: { type: string }
        title: { type: string }
        description: { type: string }
        imageUrl: { type: string }

    TimelineListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Timeline" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Gallery ----------
    Gallery:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        imageUrl: { type: string }
        imageUrls: { type: array, items: { type: string } }
        category: { type: string, enum: [event, poster, team, other] }
        eventRef: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GalleryListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Gallery" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Announcement ----------
    Announcement:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        body: { type: string }
        important: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
        important: { type: boolean }

    AnnouncementListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Announcement" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Doubt ----------
    DoubtReply:
      type: object
      properties:
        _id: { type: string }
        body: { type: string }
        author: { type: string, description: "User id, or populated User object" }
        upvotes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Doubt:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        body: { type: string }
        domain: { type: string }
        author: { type: string, description: "User id, or populated User object" }
        replies: { type: array, items: { $ref: "#/components/schemas/DoubtReply" } }
        resolved: { type: boolean }
        upvotes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DoubtListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Doubt" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Blog ----------
    Blog:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        content: { type: string }
        coverImage: { type: string }
        tags: { type: array, items: { type: string } }
        author: { type: string, description: "User id, or populated User object" }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BlogInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        coverImage: { type: string }
        tags: { type: array, items: { type: string } }
        published: { type: boolean, default: true }

    BlogListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Blog" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Opportunity ----------
    Opportunity:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        company: { type: string }
        type: { type: string, enum: [internship, job, freelance, open_source] }
        domain: { type: string }
        description: { type: string }
        applyLink: { type: string }
        deadline: { type: string, format: date-time }
        postedBy: { type: string, description: "User id, or populated User object" }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OpportunityInput:
      type: object
      required: [title, company, applyLink]
      properties:
        title: { type: string }
        company: { type: string }
        type: { type: string, enum: [internship, job, freelance, open_source], default: internship }
        domain: { type: string }
        description: { type: string }
        applyLink: { type: string }
        deadline: { type: string, format: date-time }
        isActive: { type: boolean }

    OpportunityListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Opportunity" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Resource ----------
    Resource:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        url: { type: string }
        category: { type: string, enum: [PDF, GitHub, YouTube, Docs, Other] }
        domain: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ResourceInput:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }
        category: { type: string, enum: [PDF, GitHub, YouTube, Docs, Other], default: Other }
        domain: { type: string }
        description: { type: string }

    ResourceListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Resource" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Team ----------
    TeamMember:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        role: { type: string }
        subtitle: { type: string }
        category: { type: string, enum: [founder, faculty, core, mentor] }
        teamYear: { type: integer, nullable: true }
        batch: { type: integer }
        domain: { type: array, items: { type: string } }
        imageUrl: { type: string }
        linkedin: { type: string }
        github: { type: string }
        order: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TeamMemberForm:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string }
        subtitle: { type: string }
        category: { type: string, enum: [founder, faculty, core, mentor] }
        teamYear: { type: integer }
        batch: { type: integer }
        domain: { type: string, description: "Comma-separated list" }
        linkedin: { type: string }
        github: { type: string }
        order: { type: integer }
        image: { type: string, format: binary }

    TeamMemberListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/TeamMember" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Contact ----------
    ContactInfo:
      type: object
      properties:
        _id: { type: string }
        email: { type: string }
        location: { type: string }
        department: { type: string }
        github: { type: string }
        linkedin: { type: string }
        instagram: { type: string }
        twitter: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContactInfoInput:
      type: object
      properties:
        email: { type: string }
        location: { type: string }
        department: { type: string }
        github: { type: string }
        linkedin: { type: string }
        instagram: { type: string }
        twitter: { type: string }

    # ---------- Collaboration ----------
    Representative:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string }
        avatar: { type: string }
        avatarColor: { type: string, default: "from-blue-400 to-indigo-600" }

    Collaboration:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        type: { type: string }
        description: { type: string }
        website: { type: string }
        logoText: { type: string }
        representatives: { type: array, items: { $ref: "#/components/schemas/Representative" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CollaborationInput:
      type: object
      required: [name, type, description, website, logoText]
      properties:
        name: { type: string }
        type: { type: string }
        description: { type: string }
        website: { type: string }
        logoText: { type: string }
        representatives: { type: array, items: { $ref: "#/components/schemas/Representative" } }

    CollaborationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/Collaboration" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    # ---------- Mentorship ----------
    Mentorship:
      type: object
      properties:
        _id: { type: string }
        studentId: { type: string, description: "User id, or populated User object" }
        mentorId: { type: string, description: "User id, or populated User object" }
        requestId: { type: string }
        status: { type: string, enum: [active, ended] }
        startedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MentorshipRequest:
      type: object
      properties:
        _id: { type: string }
        studentId: { type: string, description: "User id, or populated User object" }
        mentorId: { type: string, description: "User id, or populated User object" }
        message: { type: string }
        status: { type: string, enum: [pending, accepted, rejected, completed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GoalTask:
      type: object
      required: [title]
      properties:
        _id: { type: string }
        title: { type: string }
        isCompleted: { type: boolean, default: false }
        completedAt: { type: string, format: date-time, nullable: true }

    MentorshipGoal:
      type: object
      properties:
        _id: { type: string }
        mentorshipId: { type: string }
        title: { type: string }
        description: { type: string }
        tasks: { type: array, items: { $ref: "#/components/schemas/GoalTask" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---------- Point Rule / Ledger ----------
    PointTier:
      type: object
      required: [label, min, points]
      properties:
        label: { type: string, example: "Specialist" }
        min: { type: number, example: 1400 }
        max: { type: number, nullable: true, example: 1599 }
        points: { type: number, example: 50 }

    PointRule:
      type: object
      properties:
        _id: { type: string }
        key:
          type: string
          enum:
            - doubt_answered
            - doubt_resolved
            - event_attended
            - project_posted
            - seminar_attended
            - hackathon_participation
            - contest_participation
            - codeforces_rating
            - leetcode_solve_score
            - github_contributions
        label: { type: string }
        type: { type: string, enum: [flat, tiered] }
        flatPoints: { type: number }
        tiers: { type: array, items: { $ref: "#/components/schemas/PointTier" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PointLedger:
      type: object
      description: Internal audit trail of every point award; not directly exposed by its own endpoint but referenced by the leaderboard.
      properties:
        _id: { type: string }
        student: { type: string }
        ruleKey: { type: string }
        sourceType: { type: string, enum: [in_house, external] }
        sourceId: { type: string, nullable: true }
        rawValue: { type: number, nullable: true }
        month: { type: string, example: "2026-06" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LeaderboardEntry:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        batch: { type: integer }
        domain: { type: array, items: { type: string } }
        points: { type: number }
        breakdown:
          type: object
          description: Points broken down per rule key
          additionalProperties: { type: number }

    # ---------- Coding ----------
    CodingSubmission:
      type: object
      properties:
        title: { type: string }
        titleSlug: { type: string }
        problem: { type: string }
        contestName: { type: string }
        verdict: { type: string }
        language: { type: string }
        url: { type: string }
        solvedAt: { type: string, format: date-time, nullable: true }

    CodingContest:
      type: object
      properties:
        contestId: { type: integer, nullable: true }
        contestName: { type: string }
        oldRating: { type: integer, nullable: true }
        newRating: { type: integer, nullable: true }
        rank: { type: integer, nullable: true }
        ratingUpdateTimeSeconds: { type: integer, nullable: true }

    CodingProfile:
      type: object
      description: Normalized, public-safe view of a user's connected coding platforms.
      properties:
        userId: { type: string }
        leetcodeUsername: { type: string }
        codeforcesHandle: { type: string }
        githubUsername: { type: string }
        leetcode:
          type: object
          properties:
            totalSolved: { type: integer, nullable: true }
            easySolved: { type: integer, nullable: true }
            mediumSolved: { type: integer, nullable: true }
            hardSolved: { type: integer, nullable: true }
            ranking: { type: integer, nullable: true }
            recentSubmissions: { type: array, items: { $ref: "#/components/schemas/CodingSubmission" } }
            lastSyncedAt: { type: string, format: date-time, nullable: true }
            verified: { type: boolean }
        codeforces:
          type: object
          properties:
            handle: { type: string }
            rating: { type: integer, nullable: true }
            maxRating: { type: integer, nullable: true }
            rank: { type: string }
            maxRank: { type: string }
            solvedCount: { type: integer, nullable: true }
            recentSubmissions: { type: array, items: { $ref: "#/components/schemas/CodingSubmission" } }
            contestHistory: { type: array, items: { $ref: "#/components/schemas/CodingContest" } }
            lastSyncedAt: { type: string, format: date-time, nullable: true }
            verified: { type: boolean }
        github:
          type: object
          properties:
            username: { type: string }
            contributions: { type: integer, nullable: true }
            projects: { type: integer, nullable: true }
            followers: { type: integer, nullable: true }
            following: { type: integer, nullable: true }
            publicRepos: { type: integer, nullable: true }
            recentActivity: { type: array, items: { $ref: "#/components/schemas/CodingSubmission" } }
            lastSyncedAt: { type: string, format: date-time, nullable: true }
            verified: { type: boolean }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    CodingSyncResult:
      type: object
      properties:
        platform: { type: string, enum: [leetcode, codeforces, github] }
        status: { type: string, enum: [synced, cached, cleared, failed] }
        cooldownRemainingMs: { type: integer }
        error: { type: string }
        data: { type: object, description: "The platform-specific sub-object of CodingProfile" }

    CodingSyncResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/CodingProfile" }
        meta: { type: object, description: "The single-platform sync result for this call" }
