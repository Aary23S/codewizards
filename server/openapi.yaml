              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/contact/message:
    post:
      tags: [Contact]
      summary: Send a public "contact us" message (emailed to the club inbox)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
