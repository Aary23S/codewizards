      summary: Send a mentorship request to a mentor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mentorId, message]
              properties:
                mentorId: { type: string }
                message: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/MentorshipRequest" }
        "400":
          description: A pending request to this mentor already exists, or validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/mentorship/my-requests:
    get:
      tags: [Mentorship]
      summary: List mentorship requests where the current user is student or mentor
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Requests (studentId/mentorId populated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MentorshipRequest" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/mentorship/{id}/status:
    patch:
      tags: [Mentorship]
      summary: Accept or reject a mentorship request (mentor only)
      description: Accepting atomically creates (or reuses) an active Mentorship connection.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, rejected] }
      responses:
        "200":
          description: Request updated (and connection created if accepted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      request: { $ref: "#/components/schemas/MentorshipRequest" }
                      connection:
                        type: object
                        description: "null when the request was rejected"
                        nullable: true
                        allOf:
                          - { $ref: "#/components/schemas/Mentorship" }
        "400":
          description: Already processed, or invalid status value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the target mentor)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

