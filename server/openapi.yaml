  # ---------------------------------------------------------------- Coding
  /api/v1/coding/connect:
    post:
      tags: [Coding]
      summary: Connect/update one or more coding-platform handles and immediately sync them
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of the three (any accepted alias) is required.
              properties:
                leetcodeUsername: { type: string }
                leetcode: { type: string, description: "Alias for leetcodeUsername" }
                leetcodeHandle: { type: string, description: "Alias for leetcodeUsername" }
                codeforcesHandle: { type: string }
                codeforces: { type: string, description: "Alias for codeforcesHandle" }
                codeforcesUsername: { type: string, description: "Alias for codeforcesHandle" }
                githubUsername: { type: string }
                github: { type: string, description: "Alias for githubUsername" }
                githubHandle: { type: string, description: "Alias for githubUsername" }
      responses:
        "200":
          description: Connected and synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CodingProfile" }
                  meta:
                    type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: "#/components/schemas/CodingSyncResult" }
                      user: { $ref: "#/components/schemas/User" }
        "400":
          description: No handle provided, or invalid handle format
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Sync cooldown still active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CooldownResponse" }

  /api/v1/coding/profile/me:
    get:
      tags: [Coding]
      summary: Get the current user's coding profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Coding profile (null data if never connected)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    description: "null if this user has never connected a coding profile"
                    nullable: true
                    allOf:
                      - { $ref: "#/components/schemas/CodingProfile" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/coding/sync:
    post:
      tags: [Coding]
      summary: Re-sync all three platforms using the handles already stored on the current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CodingProfile" }
                  meta:
                    type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: "#/components/schemas/CodingSyncResult" }
                      cooldownRemainingMs: { type: integer, example: 0 }
                      user: { $ref: "#/components/schemas/User" }
        "400":
          description: Sync failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Sync cooldown still active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CooldownResponse" }

