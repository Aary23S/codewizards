openapi: 3.0.3
info:
  title: CodeWizards API
  version: "1.0.0"
  description: >
    Backend API for CodeWizards, a student tech-club platform (projects, events,
    mentorship, doubts, blogs, coding-profile tracking, gamified leaderboard, and
    club administration). All endpoints are prefixed with /api/v1 except the root
    health check.
servers:
  - url: http://localhost:5000
    description: Local development
  - url: /
    description: >
      Production — the deployed base URL is read at runtime from the
      RENDER_EXTERNAL_URL environment variable (Render.com deployment); no fixed
      production hostname is hard-coded in the app.

tags:
  - name: Health
    description: Service/DB liveness check (no /api/v1 prefix)
  - name: Auth
    description: Registration, login, session, and password-reset flows
  - name: Projects
    description: Club project showcase
  - name: Events
    description: Events, registrations, attendance OTP verification
  - name: Timeline
    description: Club history milestones
  - name: Gallery
    description: Photo gallery
  - name: Announcements
    description: Club announcements/notices
  - name: Users
    description: User profiles and admin user management
  - name: Mentorship
    description: Mentor/mentee requests, connections, and shared goals
  - name: Resources
    description: Curated learning resources
  - name: Opportunities
    description: Internship/job/freelance/open-source postings
  - name: Doubts
    description: Q&A / doubt-solving board
  - name: Sync
    description: Legacy single-platform coding-stat sync endpoints
  - name: Coding
    description: Coding-profile connect/sync (LeetCode, Codeforces, GitHub)
  - name: Leaderboard
    description: Points-based student leaderboard
  - name: Point Rules
    description: Admin configuration of the points-engine rules
  - name: Blogs
    description: Member-authored blog posts
  - name: Team
    description: Public team/leadership roster
  - name: Contact
    description: Club contact info and public contact form
  - name: Collaborations
    description: Partner organizations / collaborations showcase

security: []

paths:
  /:
    get:
      tags: [Health]
      summary: Health check (API + DB connectivity)
      description: >
        Not under /api/v1. Reports 200 when the process is up and Mongoose's
        connection state is "connected"; otherwise 503 with the same shape.
      security: []
      responses:
        "200":
          description: API is running and the database is connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "CodeWizards API running" }
                  db: { type: string, example: "connected" }
        "503":
          description: API is running but the database is unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "API running, database unavailable" }
                  db: { type: string, example: "disconnected" }

  # ---------------------------------------------------------------- Auth
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (role is derived from batch, never client-supplied)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                batch:
                  type: integer
                  description: Graduation year, e.g. 2026. Used to derive role (student/senior/alumni).
                programName: { type: string }
                programDurationYears: { type: integer, minimum: 1, maximum: 10, default: 4 }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/AuthUser" }
        "400":
          description: Validation error, or email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many registration attempts (rate limited — 10 per 15 minutes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/AuthUser" }
        "400":
          description: Validation error (missing/invalid email or password)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many login attempts (rate limited — 15 per 15 minutes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "401":
          description: Not authorized / invalid or stale token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Account suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (invalidates every JWT issued to this user, on every device)
      description: Increments tokenVersion server-side so all previously issued tokens fail future auth checks.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset email
      description: >
        Always responds 200 with a generic message whether or not the email is
        registered, to avoid leaking which emails exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Generic acknowledgement (email sent if the account exists)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "400":
          description: Validation error (invalid email format)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many requests (rate limited — 5 per 15 minutes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password using the raw token emailed to the user
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          description: Raw reset token from the emailed link (hashed and matched server-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 6 }
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "400":
          description: Invalid/expired reset link, or validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------- Projects
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      security: []
      parameters:
        - $ref: "#/components/parameters/FeaturedFilter"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of projects (flat array, or paginated if page+limit are both sent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectListResponse" }
    post:
      tags: [Projects]
      summary: Create a project (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Project" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/projects/{id}:
    get:
      tags: [Projects]
      summary: Get a project by id
      security: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Project" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [Projects]
      summary: Update a project (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Project" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Projects]
      summary: Delete a project (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------- Events
  /api/v1/events:
    get:
      tags: [Events]
      summary: List events (with computed status and the caller's registration info)
      description: >
        Auth is optional (optionalProtect). If a valid bearer token is sent, or a
        studentId query param, each event's `registration` block reflects that
        user's registration state.
      security: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [upcoming, completed] }
        - name: featured
          in: query
          schema: { type: string, enum: ["true"] }
        - name: studentId
          in: query
          schema: { type: string }
          description: Optional — used instead of the bearer token's user id to compute registration status
      responses:
        "200":
          description: List of events with registration info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventWithRegistration" }
    post:
      tags: [Events]
      summary: Create an event (admin only)
      description: status is auto-derived from the supplied date (past date => completed).
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/EventInputForm" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Event" }
        "400":
          description: Validation error / bad image upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/events/my-registrations:
    get:
      tags: [Events]
      summary: List event ids the current user is actively registered for
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Array of event id strings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { type: string }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/events/{id}:
    get:
      tags: [Events]
      summary: Get a single event (with computed status and registration info)
      security: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: studentId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/EventWithRegistration" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [Events]
      summary: Update an event (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/EventInputForm" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Event" }
        "400":
          description: Validation error / bad image upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Events]
      summary: Delete an event (admin only) — also removes its registrations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/registrations:
    get:
      tags: [Events]
      summary: List all registrations for an event (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Registrations (studentId populated with name/email/batch)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventRegistration" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/events/{id}/register:
    post:
      tags: [Events]
      summary: Register the current user for an event
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: A previously cancelled registration was reactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Registration reactivated" }
                  data: { $ref: "#/components/schemas/EventRegistration" }
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/EventRegistration" }
        "400":
          description: Already registered/attended for this event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Event not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Events]
      summary: Cancel the current user's registration for an event
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Registration cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Registration cancelled successfully" }
                  data: { $ref: "#/components/schemas/EventRegistration" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No registration found to cancel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/events/{id}/otp:
    post:
      tags: [Events]
      summary: Generate a 6-digit attendance-verification OTP for an event (admin only)
      description: OTP is valid for 30 minutes.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OTP generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      otpCode: { type: string, example: "482913" }
                      expiresAt: { type: string, format: date-time }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Event not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/events/{id}/verify:
    post:
      tags: [Events]
      summary: Verify an attendance OTP and mark the current user's registration as attended
      description: On success, awards a PointLedger entry for the event's type (hackathon/contest/seminar).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "482913" }
      responses:
        "200":
          description: Attendance verified (or already checked in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Attendance verified successfully" }
                  data: { $ref: "#/components/schemas/EventRegistration" }
        "400":
          description: Missing/invalid/expired code, not registered, or registration cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Event not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------- Timeline
  /api/v1/timeline:
    get:
      tags: [Timeline]
      summary: List timeline milestones (oldest first)
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineListResponse" }
    post:
      tags: [Timeline]
      summary: Create a milestone (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimelineInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Timeline" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/timeline/{id}:
    patch:
      tags: [Timeline]
      summary: Update a milestone (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimelineInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Timeline" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Access denied (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Timeline]
      summary: Delete a milestone (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessMessage" }
        "401":
          description: Not authorized
